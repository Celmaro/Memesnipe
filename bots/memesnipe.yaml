# Production sniper config — Phases 1-4 implemented.
# Sized so network fees are a small fraction of the order (audit #2 P0-1):
#   0.01 SOL buy + 100k microlamports/CU priority ≈ 0.000026 SOL network
#   round trip ≈ 0.26% of order. Do NOT pair a tiny buy with the old
#   1,000,000 microlamports fee — that was 3x the position (live-verified).

name: "memesnipe"
env_file: ".env"
rpc_endpoint: "${SOLANA_NODE_RPC_ENDPOINT}"
wss_endpoint: "${SOLANA_NODE_WSS_ENDPOINT}"
private_key: "${SOLANA_PRIVATE_KEY}"

enabled: true # Shadow mode run (trade.shadow_mode: true — log-only, no real sends)
separate_process: true

# Options: "pump_fun" (default), "lets_bonk", "stonk_fun"
platform: "pump_fun"

# Geyser configuration (fastest method for getting updates)
geyser:
  endpoint: "${GEYSER_ENDPOINT}"
  api_token: "${GEYSER_API_TOKEN}"
  # FIXED, not ${GEYSER_AUTH_TYPE}: listener accepts x-token/basic only and
  # PublicNode gRPC requires x-token.
  auth_type: "x-token"

# Trade execution: amount per trade and acceptable price deviation
# Research data capture (shadow-mode backtesting). When trade.shadow_mode is
# on, every detect (token seen + skip reason), sim_open (paper buy) and
# sim_close (paper sell/exit, incl. realized PnL) is appended as JSONL under
# shadow_data/YYYY-MM-DD.jsonl. Shadow-only: never active with real funds.
research:
  shadow_capture_enabled: true
  shadow_data_dir: shadow_data
  # R3-P2-5: PumpSwap graduation watcher (off by default). Detects the
  # CompletePumpAmmMigrationEvent in trade logs so post-graduation leader
  # activity is seen as PumpSwap trades, not curve trades.
  pumpswap_migrate_watcher: false
  # R3-P2-14: slot-ordered copy/monitor feed (off by default). When on, copy
  # fills release in ascending slot order so an out-of-order geyser delivery
  # cannot corrupt position state. The snipe path stays unordered.
  slot_ordered_feed_enabled: false
  # R3-P2-15: in-stream filter updates (off by default). When on, the geyser
  # request stream is queue-fed so update_subscription() can change watched
  # filters without a reconnect gap; the continuity revision still bumps so
  # consumers invalidate pre-gap cache state.
  in_stream_updates_enabled: false
  # R4-P1-7: strategies ledger (shadow-only, default ON for shadow runs).
  # Every open shadow position is also evaluated against every registered
  # exit strategy (default tp_sl + staged_trail) so one price path yields a
  # per-strategy outcome row under shadow_data/strategies/.
  strategies_ledger_enabled: true
  # Parallel exit-strategy grid — every open shadow position is evaluated
  # against each spec (kind: tp_sl | staged_trail | hold). "hold" is the
  # no-exit baseline. tp_sl variants probe tighter/looser stops; trail
  # variants come from the hour-11 backtest (trail10 was the leader).
  strategies:
    - {name: tp_sl, kind: tp_sl, config: {take_profit_pct: 0.20, stop_loss_pct: 0.20}}
    - {name: tp20_sl10, kind: tp_sl, config: {take_profit_pct: 0.20, stop_loss_pct: 0.10}}
    - {name: tp30_sl20, kind: tp_sl, config: {take_profit_pct: 0.30, stop_loss_pct: 0.20}}
    - {name: staged_trail, kind: staged_trail, config: {initial_tp_share: 0.4, initial_tp_pct: 0.25, arm_pct: 0.10, trail_pct: 0.08, hard_stop_pct: 0.20}}
    - {name: trail10, kind: staged_trail, config: {initial_tp_share: 0.0, initial_tp_pct: 0.10, arm_pct: 0.10, trail_pct: 0.10, hard_stop_pct: 0.20}}
    - {name: hold, kind: hold, config: {}}

trade:
  # Phase 1 sizing: 0.01 SOL ≈ 3% of a 0.33 SOL wallet (~30 losing trades
  # to drain). Scale up only with a live execution ledger (Phase 6).
  buy_amount: 0.01
  buy_slippage: 0.10 # Phase 4: strict entry cap
  sell_slippage: 0.15 # Phase 4: exit floor that won't revert on a dump
  sell_slippage_inflation_bps: 10 # P2-EXIT-3: extra sell-only bps so exits land
  # P2-EXIT-1: absolute pool-depth floor (SOL). Exit immediately when depth
  # drops below this (0 = off). A shallow pool may not absorb the sell later.
  min_pool_depth_sol: 0.0
  # P2-EXIT-2: cap single-sell price impact (bps of pool depth); 0 = off.
  # Remaining balance drains on later monitor passes.
  max_sell_impact_bps: 0
  # P2-STRUC-1: background blockhash refresh cadence (seconds). Lower = fresher
  # sends, more RPC pressure; 0.05 floor, public-RPC-friendly default 5.0.
  blockhash_refresh_interval: 5.0
  # R3-P2-2: durable nonce account (base58). Off by default (null). When set,
  # sends use the nonce account's stored blockhash + a nonce-advance
  # instruction (replay-protected, valid far beyond 150 blocks).
  durable_nonce_account: null
  # R3-P2-3: address lookup tables (base58 list). Off by default ([]). When
  # set, buy/sell messages compress static keys through the tables (smaller
  # tx, lower fee, faster validation).
  alt_addresses: []
  # P2-EXIT-5: close the user's token ATA in the same tx as a full-balance
  # sell, reclaiming rent atomically (RPC-verified first; off = keep ATA).
  close_ata_on_sell: false
  # R3-P1-3: Jupiter aggregator sell fallback. When a platform sell fails
  # with a pool-gone / liquidity signal (submit failure), route the exit
  # through Jupiter's quote+swap API at the caps below. Off by default.
  aggregator_fallback: false
  aggregator_slippage_bps: 500
  aggregator_max_price_impact_pct: 20.0

  # Phase 2: extreme-fast stays OFF until the sizing model is corrected.
  # A fixed token count (20) bought dust that could not be sold (6024
  # Overflow, live-verified on DICE). The normal path sizes from the curve.
  extreme_fast_mode: false
  extreme_fast_token_amount: 0 # unused while extreme_fast_mode is false
  trust_create_event: true
  curve_refresh_budget: 2.0

  # Phase 4: hybrid TP/SL exit with coherent timing.
  exit_strategy: "tp_sl"
  # R4-P1-7: exit shape within the tp_sl family. "tp_sl" (default) = current
  # single/staged TP/SL unchanged. "staged_trail" = asymmetric staged-then-
  # trail: sell 40% at +25%, arm a break-even floor at +10%, trail the rest
  # 8% behind each new high, exit on the floor or the -20% hard stop. The
  # same rule is shadow-tested in parallel via the strategies ledger
  # (research.strategies_ledger_enabled) regardless of which mode is active.
  exit_mode: "trail10"
  trail_initial_tp_share: 0.4  # fraction of the position sold at first TP
  trail_initial_tp_pct: 0.25  # +25% first take-profit level
  trail_arm_pct: 0.10  # +10% unrealized arms the break-even floor
  trail_trail_pct: 0.08  # floor trails 8% behind each new high
  trail_hard_stop_pct: 0.20  # -20% hard stop before any profit is armed
  # trail10 (exit_mode "trail10"): pure trailing stop, backtest winner
  # (5h replay, 2420 trades: +25.1% avg vs +16.7% tp_sl, 67.8% WR)
  trail10_arm_pct: 0.10  # arm the trail once unrealized reaches +10%
  trail10_trail_pct: 0.10  # exit when price falls 10% off its peak
  trail10_hard_stop_pct: 0.20  # -20% hard stop if the trail never arms
  # R3-P2-12: event-driven sell-fill (off by default = current polling). When
  # on, a TradeEvent from the bot's own wallet prompts the monitor to evaluate
  # the exit immediately instead of waiting for the next price-check tick.
  event_driven_exits_enabled: false
  take_profit_percentage: 0.20 # +20% profit target
  stop_loss_percentage: 0.20 # -20% stop loss
  # R3-P1-2: staged TP/SL ranges (off by default = current single TP/SL
  # unchanged). Each range: {from_pct, to_pct, step, share} as fractions —
  # sell `share` of the position at each `step` between from_pct and to_pct.
  # from_pct == to_pct is a single step that fires on a jump past it.
  # Example: sell 25% of the position at +40%, +60%, +80%, +100% TP
  #   tp_ranges: [{from_pct: 0.4, to_pct: 1.0, step: 0.2, share: 0.25}]
  # Example: sell 50% at -10%, then everything at -30% SL
  #   sl_ranges: [{from_pct: -0.1, to_pct: -0.3, step: 0.2, share: 0.5}]
  tp_ranges: []
  sl_ranges: []
  max_hold_time: null # removed 2026-10-26: TP/SL now govern exits (shadow test)
  # R4-P1-9: stagnation exit (opt-in, 0 = off). If price stays inside
  # stagnation_band_pct of entry for stagnation_exit_min minutes, exit —
  # a flat token's hype window passed (53-trade cohort: median hold <15m).
  stagnation_exit_min: 0 # minutes; 0 = off
  stagnation_band_pct: 0.02 # +/-2% band around the entry price
  price_check_interval: 1 # 1s checks << 30s hold (validated at load)
  max_exit_sell_attempts: 5 # bounded retries with fresh price floor
  # Phase 3: after the bounded retries are spent, the position is handed to a
  # persistent exit watcher that keeps re-pricing and selling until it clears
  # or this TTL expires (never silently abandoned).
  persistent_exit_ttl: 600 # seconds the watcher keeps trying
  persistent_exit_interval: 15 # seconds between watcher retries
  # Improvement #3: orphaned-token sweeper (0 = off). Scans the wallet for
  # tokens the bot owns but isn't tracking (restart leftovers, late-confirmed
  # buys, abandoned positions) and sells them through the persistent watcher.
  stuck_sweep_interval: 60 # seconds between wallet scans; 0 disables
  # Improvement #8: shadow/paper mode — record simulated decisions and
  # outcomes without sending transactions (backtest the gates risk-free).
  shadow_mode: true # SHADOW ON (log-only, no real sends) — user requested 2026-10-26
  # T2.6: RPC catch-up backfill (off by default; off = safe baseline).
  # Replays missed launches/events after a geyser gap via getSignaturesForAddress.
  backfill:
    enabled: false
    fetch_concurrency: 5
    page_size: 100
    max_pages: 5 # safety cap on pages crawled
    checkpoint: /home/agentuser/Memesnipe/state/backfill_cursor.txt

# Priority fees: transaction speed vs cost (fixed = 0 extra RPC calls)
priority_fees:
  enable_dynamic: true # T1.4 auction: sample market fee via getRecentPrioritizationFees
  enable_fixed: true # fallback when the dynamic sample is unavailable
  fixed_amount: 100_000 # fallback CU price: ~0.00001 SOL/tx at documented CU defaults
  # Improvement #6: split buy/sell priority fees — urgent buys may pay more,
  # sells (already in position) can pay less.
  # R4-P0-2: uncommented per the code-ground-truth audit — the executor
  # already wires these overrides (bot_runner passes buy_priority_fee/
  # sell_priority_fee, config_loader validates both); the YAML keys were the
  # only missing piece. Buys keep the race budget, sells use the cheaper tier.
  buy_fixed_amount: 150_000
  sell_fixed_amount: 50_000
  extra_percentage: 0.0
  # T1.4 auction bid: pay this multiple of the sampled top fee (1.0 = match
  # the market; 1.1 = 10% above it to win the race). Capped by hard_cap.
  bid_multiplier: 1.1
  # T1.4: how long the dynamic sampler reuses one RPC sample, so the auction
  # re-prices without paying an RPC round-trip on the hot path.
  fee_cache_ttl: 2.0
  hard_cap: 200_000 # ceiling on the CU price

# T2.2: Jito bundle executor (disabled). When enabled, buys/sells go through
# the block-engine bundle path with a tip, falling back to the direct RPC send
# if the bundle is rejected. Tips cost real lamports per landed trade.
jito:
  enabled: false
  tip_lamports: 10_000 # tip to the bundle validator (~0.00001 SOL)
  # endpoints: optional; defaults to the 5 regional block-engine URLs
  # P2-STRUC-4: base58 auth keypairs rotated per request (region rotation).
  # Empty = unsigned. Keep these OUT of git: a committed Jito keypair is a
  # live credential (see the RISKS section of the implementation plan).
  auth_keypairs: []
  # R3-P2-6: DontFront/MEV shield (off by default). When jito is on and real
  # mode is armed, route sends through the DontFront-compatible block-engine
  # variant (sandwich protection). Shadow mode unaffected.
  dontfront: false

# R3-P2-10: session risk guards (0 = off). The loss limit blocks NEW buys
# while sells still run — it never traps money in a falling position.
risk:
  max_concurrent_positions: 0 # 0 = off (unlimited open positions; shadow A/B needs the sample)
  daily_loss_limit_sol: 0 # realized-loss floor for the session; 0 = off
  budget_sol: 0 # cap on total quote spent on buys this session; 0 = off

# Filters for token selection
filters:
  match_string: null
  bro_address: null
  allowed_quote_mints: ["sol"]
  listener_type: "geyser"
  max_token_age: 0 # 0 = off (accept any queue age; was 1.0s, tighter than our own ~1.2s/token processing)
  max_transfer_fee_bps: 0 # reject Token-2022 transfer-tax coins outright
  # Quality gates
  blocked_creators: []
  # P2-STRUC-2: creator-PnL persistent blacklist. When on, a creator whose
  # realized net PnL stays <= max_net_sol over >= min_trades trades goes on a
  # persistent skip list (state/creator_pnl.db).
  creator_pnl_blacklist_enabled: true # Enabled 2026-10-27: ledger fed by tools/rug_memory.py (shadow closes + grad rugs)
  creator_pnl_db_path: state/creator_pnl.db
  creator_pnl_min_trades: 3
  creator_pnl_max_net_sol: 0.0
  # P2-EXIT-4: slot-delta rug heuristics (off). On: exits immediately when the
  # pool drains below early_drain_ratio of its entry depth, or the coin has
  # fewer than min_unique_buyers check_slots after our buy.
  rug_heuristics_enabled: false
  rug_min_unique_buyers: 2
  rug_check_slots: 12
  rug_early_drain_ratio: 0.5
  max_market_cap_sol: 40.0 # above pump.fun launch MC (~28 SOL): rejects already-pumped, passes normal launches
  min_curve_progress_sol: 0.25 # Phase 5 trial: skip dead launches
  # Improvement #4: buy-on-breakout — buy only after MC rises through this.
  # Leave null to keep pure launch sniping (max cap only).
  min_market_cap_sol: null
  # R3-P0-2: Mayhem Mode coins are a distinct asset class (AI agent mints
  # +1B tokens and trades randomly for 24h; 1 in 50 graduations fills the
  # pool). Off by default: mayhem coins are skipped entirely. Enable only if
  # you want to trade them as their own strategy.
  allow_mayhem_mode: false
  # R3-P0-3: holder-reward coins (creator fee to holders; creator is a
  # pump.fun address). Trading is identical, so default is "trade"; "skip"
  # refuses them. cashback is legacy-only and never gated.
  holder_reward_mode: "trade"
  # R3-P1-4: exit when the coin's creator wallet sells (off by default).
  # The monitor loop watches the listener trade feed for a creator sell.
  exit_on_creator_sell: false
  # R3-P1-5: holder-concentration gates (0 = off). Background refresher
  # fills the holder snapshot; fail-open until it has data for a mint.
  min_unique_holders: 0
  max_top10_concentration: 0.0
  # R4-P1-10: Gini-coefficient gate (0 = off). Refuses coins whose OBSERVED
  # holder distribution is too unequal — rugs run Gini > 0.8, normal < 0.5
  # (2608.01609). Same holder snapshot as the top-10 gate.
  max_gini_coefficient: 0.0
  # R4-P1-1: multi-dimensional rug-risk score gate (0 = off). Weighted sum
  # over creator cadence / holder concentration / buyer set (local features
  # only — no hot-path RPC); refuses when the score exceeds the threshold.
  # Calibrated on replay before arming.
  rug_score_threshold: 0.0
  # R4-P1-2: creator-factory gate (0 = off; launches/hour). Refuses coins
  # whose creator deploys faster than this (factory mass-deployers —
  # 2609.10246; disposable-token rug history — 2602.13480).
  factory_deploy_rate: 0.0
  # R4-P1-3: insider-coordination gate (0 = off; share 0..1). Refuses coins
  # where this fraction of early-buyer wallets co-fire across many launches
  # (MELT: 36.5% of supply held by coordinated accounts on average).
  max_coordinated_supply_share: 0.0
  # R4-P1-6: wash-trade share gate (0 = off; share 0..1). Refuses coins
  # where this fraction of recent quote volume comes from wallets that
  # round-trip the same mint (fake volume; 2507.01963: 82.8% of high-return
  # tokens show artificial growth).
  max_wash_share: 0.0
  # R4-P3-1: fragility-scaled position sizing (1.0 = off). When the
  # ME2F two-signal trigger fires (volatility/whale score AND trade rate
  # both >= thresholds), buy size scales down toward fragility_scale_min.
  fragility_scale_min: 1.0
  fragility_whale_threshold: 0.6  # VDS/whale score trigger
  fragility_rate_threshold: 0.6  # SAS/trade-rate trigger
  # R3-P2-8: metadata socials gate (0 = off). When >0, require at least this
  # many non-empty metadata extensions (twitter/telegram/website) from the
  # token's metadata JSON. Fail-open until the refresher has read it.
  min_metadata_extensions: 0
  # R3-P2-10: session risk guards (0 = off). Daily-loss limit blocks NEW
  # buys once realized losses pass the limit (sells still run); budget caps
  # total session spend; max_concurrent_positions caps open positions.
  risk:
    max_concurrent_positions: 0
    daily_loss_limit_sol: 0.0
    budget_sol: 0.0
  # Improvement #5: bound the tracked queue so a launch flood can't grow it
  # without limit (drop oldest beyond this).
  max_tracked_tokens: 500
  fail_closed_gates: true # RPC error in a gate = refuse the coin, not pass it
  # T2.4 confirmation window: consecutive curve-gate passes before buying.
  # 1 = single check. >1 guards against a transient RPC-blip false pass.
  consecutive_match_count: 1
  gate_recheck_interval: 0.5 # seconds between confirmation rechecks
  # T2.5 honeypot gates (off by default; fail-open on read errors).
  # Freeze-authority: reject mints whose account carries a freeze authority.
  honeypot_freeze_authority: false
  # Curve supply-hold: reject coins whose curve holds less than this fraction
  # of total supply (0 disables). ~80% is the pump.fun launch norm.
  min_curve_hold_fraction: 0.0
  marry_mode: false # MUST be false so the bot auto-sells
  yolo_mode: true # Phase 3: continuous sniping (freshness fix landed)

# T3.2: copy-trader engine (disabled by default; off = safe baseline).
# Mirrors leader buys only for wallets inserted into the targets DB.
# NOTE: this block is TOP-LEVEL (not under filters:). bot_runner and
# config_loader read it as ``copy_trader.enabled``; the previous nesting
# under filters: silently disabled the engine despite enabled: true
# (caught by verify_copy_hardening during R4-P2).
copy_trader:
  enabled: true # 5 targets loaded 2026-10-26 (Tier 1/3). Shadow-safe: mirror
                # buys simulate + record to shadow_data/ in shadow mode.
  db: /home/agentuser/Memesnipe/state/copy_targets.db
  min_buy_interval: 5.0 # seconds between mirrored buys (rate guard)
  # R4-P2-1: persistent-ring vetting (0 = off). Stop mirroring a leader
  # whose buys co-fire with the same peer wallets across >= this many
  # launches (2607.02795 method on our own feed).
  ring_cofire_threshold: 0
  # R4-P2-2: anti-front-run mirror jitter (ms, 0 = off) + split (1 = one
  # fill). Jitter randomizes the mirror delay; split sends the mirrored
  # size in N quanta so followers can't front-run the full amount.
  mirror_jitter_ms: 0
  mirror_split_quanta: 1
  # R4-P2-3: leader quality gate (0 = off). When set, leaders scoring
  # below this 0..1 composite are not mirrored (realized PnL, frequency,
  # concentration, realization ratio).
  min_leader_score: 0.0

# Retry and timeout settings
retries:
  max_attempts: 1
  wait_after_creation: 1 # Phase 4: short stabilization wait
  wait_after_buy: 5 # holding period before monitoring kicks in
  wait_before_new_token: 2 # 2s breather between trades

# Token and account management
cleanup:
  mode: "after_sell" # closes the ATA after each sell to reclaim rent
  force_close_with_burn: false
  with_priority_fee: true

# Node provider configuration
node:
  max_rps: 25 # match your provider's RPS limit
  # R4-P4-3: startup RPC latency self-test (off by default). Three get_slot
  # round trips at boot; warns when avg > 200 ms (snipe races are lost on
  # latency before fees ever matter).
  startup_latency_test: false